name: "Publish Desktop App Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-ai.txt pyinstaller

      - name: build python backend
        run: |
          cd backend
          python build_backend.py

      - name: copy backend to tauri sidecar bin
        run: |
          mkdir src-tauri/bin
          copy backend/dist/localmind-backend.exe src-tauri/bin/localmind-backend-x86_64-pc-windows-msvc.exe

      - name: download and embed ollama sidecar
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/download/v0.1.48/ollama-windows-amd64.zip" -OutFile "ollama.zip"
          Expand-Archive -Path "ollama.zip" -DestinationPath "ollama_extracted"
          copy "ollama_extracted/ollama.exe" "src-tauri/bin/ollama-x86_64-pc-windows-msvc.exe"

      - name: download default tauri icons
        shell: pwsh
        run: |
          mkdir src-tauri/icons -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/128x128.png" -OutFile "src-tauri/icons/128x128.png"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/128x128@2x.png" -OutFile "src-tauri/icons/128x128@2x.png"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/32x32.png" -OutFile "src-tauri/icons/32x32.png"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/icon.icns" -OutFile "src-tauri/icons/icon.icns"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/icon.ico" -OutFile "src-tauri/icons/icon.ico"

      - name: install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: build tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "LocalMind OS v__VERSION__"
          releaseBody: "Standalone LocalMind OS desktop installer. Includes support for local Ollama and local vector search."
          releaseDraft: true
          prerelease: false
