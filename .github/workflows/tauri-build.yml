name: "Publish Desktop App Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-ai.txt pyinstaller

      - name: build python backend
        run: |
          cd backend
          python build_backend.py

      - name: copy backend to tauri sidecar bin (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          Copy-Item backend/dist/localmind-backend.exe src-tauri/bin/localmind-backend-x86_64-pc-windows-msvc.exe
        shell: pwsh

      - name: copy backend to tauri sidecar bin (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p src-tauri/bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then RUST_ARCH="aarch64"; else RUST_ARCH="x86_64"; fi
          cp backend/dist/localmind-backend src-tauri/bin/localmind-backend-${RUST_ARCH}-apple-darwin
          chmod +x src-tauri/bin/localmind-backend-${RUST_ARCH}-apple-darwin

      - name: download and embed ollama sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/download/v0.1.48/ollama-windows-amd64.zip" -OutFile "ollama.zip"
          Expand-Archive -Path "ollama.zip" -DestinationPath "ollama_extracted"
          Copy-Item "ollama_extracted/ollama.exe" "src-tauri/bin/ollama-x86_64-pc-windows-msvc.exe"

      - name: download and embed ollama sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p src-tauri/bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then RUST_ARCH="aarch64"; else RUST_ARCH="x86_64"; fi
          curl -L -o src-tauri/bin/ollama-${RUST_ARCH}-apple-darwin https://github.com/ollama/ollama/releases/download/v0.1.48/ollama-darwin
          chmod +x src-tauri/bin/ollama-${RUST_ARCH}-apple-darwin

      - name: download default tauri icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/128x128.png" -OutFile "src-tauri/icons/128x128.png"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/128x128@2x.png" -OutFile "src-tauri/icons/128x128@2x.png"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/32x32.png" -OutFile "src-tauri/icons/32x32.png"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/icon.icns" -OutFile "src-tauri/icons/icon.icns"
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons/icon.ico" -OutFile "src-tauri/icons/icon.ico"

      - name: install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: install tauri cli
        run: npm install -g @tauri-apps/cli@^1

      - name: build tauri application
        run: tauri build

      - name: create draft release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).package.version
          try {
            gh release create "v$version" src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe --title "LocalMind OS v$version" --notes "Standalone LocalMind OS desktop installer. Includes support for local Ollama and local vector search." --draft
          } catch {
            gh release upload "v$version" src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe
          }

      - name: create draft release (macOS)
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .package.version src-tauri/tauri.conf.json)
          gh release create "v$VERSION" src-tauri/target/release/bundle/dmg/*.dmg --title "LocalMind OS v$VERSION" --notes "Standalone LocalMind OS desktop installer. Includes support for local Ollama and local vector search." --draft || gh release upload "v$VERSION" src-tauri/target/release/bundle/dmg/*.dmg
