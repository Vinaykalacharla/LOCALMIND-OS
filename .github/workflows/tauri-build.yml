name: "Publish Desktop App Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os-name: windows
          - platform: macos-14
            os-name: macos

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # ─── Node ────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ─── Rust ────────────────────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ─── Python ──────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies (core + AI)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-ai.txt pyinstaller

      # ─── Backend binary ──────────────────────────────────────────────────
      - name: Build Python backend (PyInstaller)
        working-directory: backend
        run: python build_backend.py

      - name: Copy backend sidecar — Windows
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          Copy-Item backend/dist/localmind-backend.exe `
            src-tauri/bin/localmind-backend-x86_64-pc-windows-msvc.exe

      - name: Copy backend sidecar — macOS
        if: matrix.os-name == 'macos'
        run: |
          mkdir -p src-tauri/bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then RUST_TARGET="aarch64-apple-darwin"; else RUST_TARGET="x86_64-apple-darwin"; fi
          cp backend/dist/localmind-backend src-tauri/bin/localmind-backend-${RUST_TARGET}
          chmod +x src-tauri/bin/localmind-backend-${RUST_TARGET}

      # ─── Ollama sidecar ──────────────────────────────────────────────────
      - name: Download Ollama sidecar — Windows
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          Invoke-WebRequest `
            -Uri "https://github.com/ollama/ollama/releases/download/v0.6.8/ollama-windows-amd64.zip" `
            -OutFile "ollama-windows.zip"
          Expand-Archive -Path "ollama-windows.zip" -DestinationPath "ollama-windows-extracted" -Force
          Copy-Item "ollama-windows-extracted/ollama.exe" `
            "src-tauri/bin/ollama-x86_64-pc-windows-msvc.exe"

      - name: Download Ollama sidecar — macOS
        if: matrix.os-name == 'macos'
        run: |
          mkdir -p src-tauri/bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            RUST_TARGET="aarch64-apple-darwin"
          else
            RUST_TARGET="x86_64-apple-darwin"
          fi
          curl -fsSL -o ollama-macos.zip \
            "https://github.com/ollama/ollama/releases/download/v0.6.8/ollama-darwin.zip"
          unzip -o ollama-macos.zip -d ollama-macos-extracted
          cp ollama-macos-extracted/ollama src-tauri/bin/ollama-${RUST_TARGET}
          chmod +x src-tauri/bin/ollama-${RUST_TARGET}

      # ─── Icons ───────────────────────────────────────────────────────────
      - name: Download Tauri default icons — Windows
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          $base = "https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons"
          foreach ($icon in @("128x128.png","128x128@2x.png","32x32.png","icon.icns","icon.ico")) {
            if (-Not (Test-Path "src-tauri/icons/$icon")) {
              Invoke-WebRequest -Uri "$base/$icon" -OutFile "src-tauri/icons/$icon"
            }
          }

      - name: Download Tauri default icons — macOS
        if: matrix.os-name == 'macos'
        run: |
          mkdir -p src-tauri/icons
          BASE="https://github.com/tauri-apps/tauri/raw/tauri-v1/tooling/cli/templates/app/src-tauri/icons"
          for icon in 128x128.png "128x128@2x.png" 32x32.png icon.icns icon.ico; do
            [ -f "src-tauri/icons/$icon" ] || curl -fsSL -o "src-tauri/icons/$icon" "$BASE/$icon"
          done

      # ─── Frontend ────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (Next.js static export)
        working-directory: frontend
        run: npm run build

      # ─── Tauri build ─────────────────────────────────────────────────────
      - name: Install Tauri CLI v1
        run: npm install -g @tauri-apps/cli@^1

      - name: Build Tauri application
        env:
          TAURI_SKIP_DEVSERVER_CHECK: "true"
        run: tauri build

      # ─── Publish GitHub Release ──────────────────────────────────────────
      - name: Read version from tauri.conf.json — Windows
        if: matrix.os-name == 'windows'
        id: version-win
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).package.version
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Read version from tauri.conf.json — macOS
        if: matrix.os-name == 'macos'
        id: version-mac
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['package']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release and upload Windows artifacts
        if: matrix.os-name == 'windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version-win.outputs.VERSION }}"
          $tag = "v$version"
          $title = "LocalMind OS v$version"
          $notes = "LocalMind OS v$version - Standalone desktop installer. Bundles Ollama and the LocalMind backend. Windows: MSI or NSIS EXE installer. macOS: DMG."

          $msi  = (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi  -ErrorAction SilentlyContinue) | Select-Object -First 1 -ExpandProperty FullName
          $nsis = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue) | Select-Object -First 1 -ExpandProperty FullName

          $files = @()
          if ($msi)  { $files += $msi }
          if ($nsis) { $files += $nsis }

          $existing = gh release view $tag 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @files --title $title --notes $notes
          } else {
            gh release upload $tag @files --clobber
          }

      - name: Publish release and upload macOS artifacts
        if: matrix.os-name == 'macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version-mac.outputs.VERSION }}"
          TAG="v${VERSION}"
          TITLE="LocalMind OS v${VERSION}"
          NOTES="LocalMind OS v${VERSION} - Standalone desktop installer. Bundles Ollama and the LocalMind backend. Windows: MSI or NSIS EXE installer. macOS: DMG."

          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "$TITLE" --notes "$NOTES"
          fi
